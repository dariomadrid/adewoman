<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADEWOMAN FISIOTERÀPIA - Carregant...</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .loading-container {
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }
    .loading-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      opacity: 0.9;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loading-text">Carregant...</div>
    <div class="spinner"></div>
  </div>
  
  <script>
    // Redirect to the main site after a short delay
    setTimeout(() => {
      window.location.href = '/ca/';
    }, 1500);
  </script>
</body>
</html>
